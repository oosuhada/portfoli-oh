<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- 직접 호스팅 -->
    <script src="../../../../career/lib/three.js"></script>
    <script src="../../../../career/lib/three-min.js"></script>
    <script src="../../../../career/lib/three-module-min.js"></script>
    <script src="../../../../career/lib/OrbitControls-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.min.js"></script>

    <style>
        /* style.css */
        .body-wrapper {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #3a3897 0%, #2c2a72 40%, #1a1a4e 100%);
        }

        .weather-widget::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 70%);
            animation: shimmer 15s infinite linear;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .weather-icon-main {
            filter: drop-shadow(0 0 12px rgba(220, 220, 255, 0.5));
            animation: floating 3.5s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        #cloud-container {
            pointer-events: auto;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fadeInUp {
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        @keyframes fadeInScaleUp {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-fadeInScaleUp {
            opacity: 0;
            animation: fadeInScaleUp 0.7s ease-out forwards;
        }

        @keyframes gentleBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-gentleBob {
            animation: gentleBob 2.5s ease-in-out infinite;
        }

        .sun-info .sunrise:hover .sun-icon,
        .sun-info .sunset:hover .sun-icon {
            transform: rotate(15deg) scale(1.15);
        }
        .sun-icon {
            transition: transform 0.3s ease-in-out;
        }

        .forecast-day:hover {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.1), 0 4px 10px rgba(0,0,0,0.2);
        }
        .forecast-day:hover .forecast-icon {
            transform: scale(1.2) translateY(-2px);
            transition: transform 0.3s ease-out;
        }
        .forecast-day .forecast-icon {
            transition: transform 0.3s ease-out;
        }

        .delay-100 { animation-delay: 0.1s !important; }
        .delay-200 { animation-delay: 0.2s !important; }
        .delay-300 { animation-delay: 0.3s !important; }
        .delay-400 { animation-delay: 0.4s !important; }
        .delay-500 { animation-delay: 0.5s !important; }
        .delay-600 { animation-delay: 0.6s !important; }
        .delay-700 { animation-delay: 0.7s !important; }
    </style>
</head>
<body>
    <div class="body-wrapper min-h-screen flex justify-center items-center p-4">
        <div class="weather-widget-container relative w-full max-w-sm sm:max-w-md">
            <div class="weather-widget relative text-white bg-gradient-to-br from-purple-700/70 via-indigo-800/60 to-blue-900/70 backdrop-blur-lg shadow-2xl rounded-3xl p-6 overflow-hidden border border-white/10">
                <div id="cloud-container" class="absolute top-0 right-0 w-36 h-36 sm:w-40 sm:h-40 z-30 cursor-pointer rounded-tr-3xl overflow-hidden">
                    <div id="cloud-tooltip" class="tooltip absolute top-20 right-2 sm:top-24 sm:right-4 bg-black/70 text-white px-3 py-1.5 rounded-md text-xs opacity-0 transition-opacity duration-300 pointer-events-none z-40 shadow-lg">
                        Click clouds for a surprise!
                        <div class="absolute -top-1 right-3 w-3 h-3 bg-black/70 transform rotate-45"></div>
                    </div>
                </div>

                <div class="relative z-20">
                    <div class="date-time text-sm font-light opacity-80 mb-1 tracking-wide animate-fadeInUp" id="dateTime">Thursday, 09:24</div>

                    <div class="current-weather flex items-center mb-2">
                        <div class="weather-icon-main text-5xl mr-3">🌧️</div>
                        <div class="temp text-5xl font-semibold">
                            <span class="bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-300 animate-fadeInScaleUp delay-100" id="temperature">28°C</span>
                        </div>
                    </div>

                    <div class="location text-lg opacity-90 mb-4 tracking-wide animate-fadeInUp delay-200" id="location">Seoul, South Korea</div>
                  
                    <div class="sun-info bg-black/30 backdrop-blur-sm rounded-2xl p-3 sm:p-4 flex justify-between items-center mb-4 border border-white/10 shadow-md animate-fadeInUp delay-300">
                        <div class="sunrise text-center">
                            <div class="sun-icon text-xl mb-1">☀️</div>
                            <div class="text-xs opacity-80" id="sunriseTime">05:35 am</div>
                        </div>
                        <div class="day-length text-center text-sm opacity-90" id="dayLength">14 h 15 m</div>
                        <div class="sunset text-center">
                            <div class="sun-icon text-xl mb-1">🌙</div>
                            <div class="text-xs opacity-80" id="sunsetTime">07:50 pm</div>
                        </div>
                    </div>

                    <div class="precipitation bg-white/10 backdrop-blur-sm rounded-xl p-3 flex items-center mb-4 border border-white/5 shadow-sm animate-fadeInUp delay-400">
                        <div class="precip-icon text-2xl mr-2 text-blue-300 drop-shadow-lg animate-gentleBob">⛈️</div>
                        <div class="text-sm opacity-90" id="precipitationChance">Rain 80%</div>
                    </div>

                    <div class="humidity-wind flex justify-between text-sm opacity-90 mb-5 animate-fadeInUp delay-500">
                        <div id="humidity">Humidity: 88%</div>
                        <div id="windSpeed">Wind: 7 km/h</div>
                    </div>

                    <div class="forecast flex flex-nowrap justify-between pb-2">
                        <div class="forecast-day bg-white/5 backdrop-blur-sm rounded-xl p-3 w-20 text-center border border-white/10 shadow-sm hover:bg-white/10 transition-all duration-200 cursor-pointer transform hover:-translate-y-1 animate-fadeInUp delay-500">
                            <div class="day-name text-xs font-medium mb-1 opacity-80">Today</div>
                            <div class="forecast-icon text-2xl my-1 drop-shadow-md">🌧️</div>
                            <div class="high-temp text-sm font-semibold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-300">28°</div>
                            <div class="low-temp text-xs opacity-70">24°</div>
                        </div>
                        <div class="forecast-day bg-white/5 backdrop-blur-sm rounded-xl p-3 w-20 text-center border border-white/10 shadow-sm hover:bg-white/10 transition-all duration-200 cursor-pointer transform hover:-translate-y-1 animate-fadeInUp delay-600">
                            <div class="day-name text-xs font-medium mb-1 opacity-80">FRI</div>
                            <div class="forecast-icon text-2xl my-1 drop-shadow-md">☀️</div>
                            <div class="high-temp text-sm font-semibold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-300">31°</div>
                            <div class="low-temp text-xs opacity-70">25°</div>
                        </div>
                        <div class="forecast-day bg-white/5 backdrop-blur-sm rounded-xl p-3 w-20 text-center border border-white/10 shadow-sm hover:bg-white/10 transition-all duration-200 cursor-pointer transform hover:-translate-y-1 animate-fadeInUp delay-700">
                            <div class="day-name text-xs font-medium mb-1 opacity-80">SAT</div>
                            <div class="forecast-icon text-2xl my-1 drop-shadow-md">🌧️</div>
                            <div class="high-temp text-sm font-semibold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-300">27°</div>
                            <div class="low-temp text-xs opacity-70">23°</div>
                        </div>
                        <div class="forecast-day bg-white/5 backdrop-blur-sm rounded-xl p-3 w-20 text-center border border-white/10 shadow-sm hover:bg-white/10 transition-all duration-200 cursor-pointer transform hover:-translate-y-1 animate-fadeInUp delay-[0.8s]">
                            <div class="day-name text-xs font-medium mb-1 opacity-80">SUN</div>
                            <div class="forecast-icon text-2xl my-1 drop-shadow-md">☁️</div>
                            <div class="high-temp text-sm font-semibold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-300">29°</div>
                            <div class="low-temp text-xs opacity-70">24°</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // script.js
        // import * as THREE from "https://esm.sh/three"; // 제거됨
        // import { OrbitControls } from "https://esm.sh/three/examples/jsm/controls/OrbitControls.js"; // 제거됨

        // Get the date and time element from the HTML
        const dateTimeEl = document.getElementById('dateTime');

        /**
         * Updates the current date and time displayed in the widget.
         * Formats the date as "Weekday, HH:MM".
         */
        function updateDateTime() {
            const now = new Date();
            const optionsDate = { weekday: 'long' };
            const optionsTime = { hour: '2-digit', minute: '2-digit', hour12: false };
            // Check if the element exists before updating its text content
            if (dateTimeEl) {
                dateTimeEl.textContent = `${now.toLocaleDateString(undefined, optionsDate)}, ${now.toLocaleTimeString([], optionsTime)}`;
            }
        }

        // Initial call to update date and time on load
        updateDateTime();
        // Update date and time every minute
        setInterval(updateDateTime, 60000);

        // Get the cloud container element where the 3D animation will be rendered
        const container = document.getElementById('cloud-container');

        // Check if the cloud container exists to prevent errors
        if (container) {
            // Get the bounding rectangle of the container for setting up the Three.js renderer size
            const containerRect = container.getBoundingClientRect();

            // Create a new Three.js scene
            const scene = new THREE.Scene(); // THREE는 전역 변수로 사용

            // Calculate camera aspect ratio based on container dimensions, defaulting to 1 if dimensions are invalid
            const cameraAspect = (containerRect.width > 0 && containerRect.height > 0) ? containerRect.width / containerRect.height : 1;
            // Create a perspective camera
            const camera = new THREE.PerspectiveCamera(60, cameraAspect, 0.1, 1000); // THREE는 전역 변수로 사용
            // Set camera position
            camera.position.set(0, 0.5, 4.5);

            // Create a WebGL renderer with antialiasing and transparency
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // THREE는 전역 변수로 사용
            // Set renderer size to match container
            renderer.setSize(containerRect.width, containerRect.height);
            renderer.setClearColor(0x000000, 0);
            // Append the renderer's DOM element to the container
            container.appendChild(renderer.domElement);

            // Add ambient light to the scene
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); // THREE는 전역 변수로 사용
            scene.add(ambientLight);
            // Add a directional light for shadows and highlights
            const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0); // THREE는 전역 변수로 사용
            directionalLight.position.set(2, 3, 2);
            scene.add(directionalLight);
            // Add a point light for additional lighting
            const pointLight = new THREE.PointLight(0xaabbee, 0.8, 15); // THREE는 전역 변수로 사용
            pointLight.position.set(-1, 1, 3);
            scene.add(pointLight);

            // Initialize OrbitControls for interactive camera control
            // OrbitControls는 전역 THREE 객체의 속성으로 사용
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;      // Enable smooth camera movement
            controls.dampingFactor = 0.07;      // Damping factor for controls
            controls.rotateSpeed = 0.8;         // Rotation speed
            controls.enableZoom = false;        // Disable zooming
            controls.enablePan = false;         // Disable panning
            controls.minPolarAngle = Math.PI / 3; // Restrict vertical rotation
            controls.maxPolarAngle = Math.PI / 1.8; // Restrict vertical rotation
            controls.target.set(0, 0, 0);       // Set the camera target to the origin

            // Create a group to hold all cloud parts
            const cloudGroup = new THREE.Group(); // THREE는 전역 변수로 사용
            scene.add(cloudGroup); // Add the cloud group to the scene

            // Define the material for the clouds with PhysicalMaterial for realistic appearance
            const cloudMaterial = new THREE.MeshPhysicalMaterial({ // THREE는 전역 변수로 사용
                color: 0xf0f8ff,            // Off-white color for clouds
                transparent: true, opacity: 0.85, // Make clouds slightly transparent
                roughness: 0.6, metalness: 0.0, // Non-metallic, slightly rough
                transmission: 0.1,          // Slight light transmission
                ior: 1.3,                   // Index of refraction
                specularIntensity: 0.2,     // Specular highlight intensity
                sheen: 0.2, sheenColor: 0xffffff, sheenRoughness: 0.5, // Sheen effect
                clearcoat: 0.05, clearcoatRoughness: 0.3, // Clearcoat layer
            });

            /**
             * Creates a single spherical part of a cloud.
             * @param {number} radius - The radius of the sphere.
             * @param {THREE.Vector3} position - The position of the sphere.
             * @returns {THREE.Mesh} - The created sphere mesh.
             */
            function createCloudPart(radius, position) {
                const geometry = new THREE.SphereGeometry(radius, 20, 20); // THREE는 전역 변수로 사용
                const mesh = new THREE.Mesh(geometry, cloudMaterial); // THREE는 전역 변수로 사용
                mesh.position.copy(position); // THREE는 전역 변수로 사용
                return mesh;
            }

            /**
             * Creates a detailed cloud composed of multiple spherical parts.
             * @param {number} x - X position of the cloud group.
             * @param {number} y - Y position of the cloud group.
             * @param {number} z - Z position of the cloud group.
             * @param {number} scale - Overall scale of the cloud.
             * @returns {THREE.Group} - The created cloud group.
             */
            function createDetailedCloud(x, y, z, scale) {
                const singleCloudGroup = new THREE.Group(); // THREE는 전역 변수로 사용
                singleCloudGroup.position.set(x, y, z);
                singleCloudGroup.scale.set(scale, scale, scale);
                // Define parts of the cloud with varying sizes and positions
                const parts = [
                    { radius: 0.8, position: new THREE.Vector3(0, 0, 0) }, // THREE는 전역 변수로 사용
                    { radius: 0.6, position: new THREE.Vector3(0.7, 0.2, 0.1) }, // THREE는 전역 변수로 사용
                    { radius: 0.55, position: new THREE.Vector3(-0.6, 0.1, -0.2) }, // THREE는 전역 변수로 사용
                    { radius: 0.7, position: new THREE.Vector3(0.1, 0.4, -0.3) }, // THREE는 전역 변수로 사용
                    { radius: 0.5, position: new THREE.Vector3(0.3, -0.3, 0.2) }, // THREE는 전역 변수로 사용
                    { radius: 0.6, position: new THREE.Vector3(-0.4, -0.2, 0.3) }, // THREE는 전역 변수로 사용
                    { radius: 0.45, position: new THREE.Vector3(0.8, -0.1, -0.2) }, // THREE는 전역 변수로 사용
                    { radius: 0.5, position: new THREE.Vector3(-0.7, 0.3, 0.3) }, // THREE는 전역 변수로 사용
                ];
                // Add each part to the cloud group
                parts.forEach(part => singleCloudGroup.add(createCloudPart(part.radius, part.position)));
                // Store cloud-specific data for animation and rain effects
                singleCloudGroup.userData = {
                    isRaining: false,
                    rainColor: Math.random() > 0.5 ? 0x87CEFA : 0xB0E0E6, // Random rain color
                    originalPosition: singleCloudGroup.position.clone(), // THREE는 전역 변수로 사용
                    bobOffset: Math.random() * Math.PI * 2, // Random offset for bobbing animation
                    bobSpeed: 0.0005 + Math.random() * 0.0003, // Random speed for bobbing
                    bobAmount: 0.15 + Math.random() * 0.1, // Random amount for bobbing
                };
                return singleCloudGroup;
            }

            // Create two detailed clouds and add them to the cloud group
            const cloud1 = createDetailedCloud(-0.7, 0.2, 0, 1.0);
            const cloud2 = createDetailedCloud(0.7, -0.1, 0.3, 0.9);
            cloudGroup.add(cloud1, cloud2);
            cloudGroup.position.y = -0.2; // Adjust vertical position of the cloud group

            let autoRotateSpeed = 0.002; // Speed for automatic cloud rotation

            /**
             * Creates raindrops for a given cloud.
             * @param {THREE.Group} cloud - The cloud group to which raindrops will be added.
             * @returns {Array<THREE.Mesh>} - An array of created raindrop meshes.
             */
            function createRaindropsForCloud(cloud) {
                const rainGroup = new THREE.Group(); // THREE는 전역 변수로 사용
                cloud.add(rainGroup); // Add the rain group as a child of the cloud
                cloud.userData.rainGroup = rainGroup; // Store reference to the rain group
                // Material for raindrops
                const raindropMaterial = new THREE.MeshBasicMaterial({ color: cloud.userData.rainColor, transparent: true, opacity: 0.7 }); // THREE는 전역 변수로 사용
                const localRaindrops = [];
                // Create multiple raindrops
                for (let i = 0; i < 30; i++) {
                    const raindropGeom = new THREE.CylinderGeometry(0.015, 0.015, 0.25, 6); // THREE는 전역 변수로 사용
                    const raindrop = new THREE.Mesh(raindropGeom, raindropMaterial); // THREE는 전역 변수로 사용
                    // Random initial position for raindrops
                    raindrop.position.set( (Math.random() - 0.5) * 1.8, -0.8 - Math.random() * 1.5, (Math.random() - 0.5) * 1.8 ); // THREE는 전역 변수로 사용
                    // Store original Y position and speed for animation
                    raindrop.userData = { originalY: raindrop.position.y - Math.random() * 0.5, speed: 0.08 + Math.random() * 0.05 };
                    localRaindrops.push(raindrop);
                    rainGroup.add(raindrop);
                }
                rainGroup.visible = false; // Hide raindrops initially
                return localRaindrops;
            }

            // Create raindrops for both clouds
            const raindrops1 = createRaindropsForCloud(cloud1);
            const raindrops2 = createRaindropsForCloud(cloud2);

            // Initialize Raycaster and Mouse vector for interaction
            const raycaster = new THREE.Raycaster(); // THREE는 전역 변수로 사용
            const mouse = new THREE.Vector2(); // THREE는 전역 변수로 사용

            // Add click event listener to the renderer's DOM element
            renderer.domElement.addEventListener('click', (event) => {
                // Get normalized device coordinates from mouse click
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                // Update the raycaster with the camera and mouse position
                raycaster.setFromCamera(mouse, camera);

                // Find intersecting objects with the raycaster from the cloud group's children
                const intersects = raycaster.intersectObjects(cloudGroup.children, true);

                if (intersects.length > 0) {
                    let clickedObj = intersects[0].object;
                    let physicallyClickedCloud = null;

                    // Traverse up the hierarchy to find the main cloud group that was clicked
                    while (clickedObj.parent && clickedObj.parent !== cloudGroup) {
                        clickedObj = clickedObj.parent;
                    }

                    // If a main cloud group was clicked
                    if (clickedObj.parent === cloudGroup) {
                        physicallyClickedCloud = clickedObj;

                        const isCloud1Raining = cloud1.userData.isRaining;
                        const isCloud2Raining = cloud2.userData.isRaining;

                        let newGlobalRainState;
                        // Toggle global rain state: if both are raining, stop; otherwise, start raining
                        if (isCloud1Raining && isCloud2Raining) {
                            newGlobalRainState = false;
                        } else {
                            newGlobalRainState = true;
                        }

                        // Apply the new rain state to cloud1 and its raindrops
                        cloud1.userData.isRaining = newGlobalRainState;
                        if (cloud1.userData.rainGroup) {
                            cloud1.userData.rainGroup.visible = newGlobalRainState;
                        }

                        // Apply the new rain state to cloud2 and its raindrops
                        cloud2.userData.isRaining = newGlobalRainState;
                        if (cloud2.userData.rainGroup) {
                            cloud2.userData.rainGroup.visible = newGlobalRainState;
                        }

                        // Add a temporary scale animation to the clicked cloud
                        if (physicallyClickedCloud) {
                            const originalScale = physicallyClickedCloud.scale.clone(); // THREE는 전역 변수로 사용
                            physicallyClickedCloud.scale.multiplyScalar(1.15); // Scale up
                            setTimeout(() => {
                                physicallyClickedCloud.scale.copy(originalScale); // Revert scale after a short delay
                            }, 150);
                        }
                    }
                }
            });

            // Get the tooltip element
            const tooltip = document.getElementById('cloud-tooltip');
            // Show tooltip briefly after a delay
            setTimeout(() => {
                if (tooltip) tooltip.classList.add('opacity-100');
                setTimeout(() => { if (tooltip) tooltip.classList.remove('opacity-100'); }, 3500);
            }, 1500);

            /**
             * Animation loop for Three.js scene.
             */
            function animate() {
                requestAnimationFrame(animate); // Request next animation frame

                const time = Date.now(); // Get current time for animations

                cloudGroup.rotation.y += autoRotateSpeed; // Rotate the entire cloud group

                // Animate individual clouds and their raindrops
                [cloud1, cloud2].forEach(cloud => {
                    if (cloud) {
                        // Apply bobbing animation to each cloud
                        cloud.position.y = cloud.userData.originalPosition.y + Math.sin(time * cloud.userData.bobSpeed + cloud.userData.bobOffset) * cloud.userData.bobAmount;

                        // If cloud is raining, animate raindrops
                        if (cloud.userData.isRaining && cloud.userData.rainGroup) {
                            const currentRaindrops = cloud === cloud1 ? raindrops1 : raindrops2; // Get specific raindrops for current cloud
                            currentRaindrops.forEach(raindrop => {
                                raindrop.position.y -= raindrop.userData.speed; // Move raindrop downwards
                                // Reset raindrop position if it goes too far down
                                if (raindrop.position.y < -5) {
                                    raindrop.position.y = -0.8;
                                    raindrop.position.x = (Math.random() - 0.5) * 1.8 * cloud.scale.x;
                                    raindrop.position.z = (Math.random() - 0.5) * 1.8 * cloud.scale.z;
                                }
                            });
                        }
                    }
                });

                controls.update(); // Update OrbitControls
                renderer.render(scene, camera); // Render the scene
            }

            // Handle window resize events to adjust camera aspect ratio and renderer size
            window.addEventListener('resize', () => {
                const newRect = container.getBoundingClientRect();
                if (newRect.width > 0 && newRect.height > 0) {
                    camera.aspect = newRect.width / newRect.height;
                    camera.updateProjectionMatrix();
                    renderer.setSize(newRect.width, newRect.height);
                }
            });

            // Start the animation loop
            animate();

        } else {
            // Log an error if the cloud container is not found
            console.error("Cloud container (id: 'cloud-container') not found! 3D cloud animation will not be initialized.");
        }
    </script>
</body>
</html>
