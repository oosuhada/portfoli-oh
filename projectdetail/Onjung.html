<div class="discover-content-left section-main-content hide-scrollbar" data-lang-ko="가족 행사에서 손으로 선물 내역을 적으며 불편함을 느낀 것이 온정의 시작입니다. 부모님은 수기로, 체계적인 분도 결국 엑셀을 쓰는 현실에서, 진짜 필요한 건 쉽고 스마트한 디지털 솔루션이었습니다." data-lang-en="Started from a simple struggle: tracking family gifts with pen and paper. Saw parents using notebooks, the most organized using Excel, and realized a digital solution was overdue.">
</div>
</div>
</section>

</div>
<div class="define-main-text">
<p data-lang-ko="온정은 나이, 디지털 경험에 상관없이 누구나 ‘바로 쓸 수 있는’ 예단·축의금 관리 앱을 목표로 설계되었습니다." data-lang-en="Onjung was designed for anyone—regardless of age or tech experience—to record and recall gifts effortlessly, with no learning curve."></p>

<div class="define-box success-box">
<h4 data-lang-ko="성공 지표" data-lang-en="Success Measure"></h4>
