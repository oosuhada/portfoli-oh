<li data-lang-ko="플랫폼 보안, 프로필 인증, 커뮤니티 가치를 앱 첫 화면에서 직관적이고 따뜻하게 안내하도록 설계함." data-lang-en="Designed a clear, welcoming onboarding flow—explaining platform security, profile verification, and community values up front."></li>
<li data-lang-ko="다국어, 보안 채팅, 실시간 피드백(마이크로 애니메이션) 등 글로벌 사용자를 고려한 UX를 구현함." data-lang-en="Focused on multi-language, secure chat, and real-time feedback (micro-animations) for a global user base."></li>
<li data-lang-ko="Riverpod 상태 관리를 통해 전 사용자 흐름에서 일관성과 신뢰성, 버그 없는 UX를 실현함." data-lang-en="Used Riverpod for reliable state management to keep every user flow consistent and bug-free."></li>
</ul>

<div class="define-box issue-box">
<h4 data-lang-ko="핵심 문제" data-lang-en="Core Issue"></h4>
<p data-lang-ko="국경 간 쇼핑은 복잡하고, 신뢰·소통·안전성에 대한 우려가 가장 큰 문제였음." data-lang-en="Cross-border shopping is complicated and risky—users worry about safety, communication, and reliability."></p>
</div>
<div class="define-main-text">
<p data-lang-ko="노마드마켓은 앱 첫 진입부터 보안, 인증, 전체 프로세스를 온보딩으로 명확히 안내해 신뢰를 쌓았음." data-lang-en="Nomad Market solves this by prioritizing trust from the first tap—using onboarding to explain security, verify profiles, and clarify the whole process up front."></p>
</div>
<div class="define-box success-box">
<h4 data-lang-ko="성공 지표" data-lang-en="Success Measure"></h4>
<p data-lang-ko="성공은 ‘온보딩→프로필 인증→반복 거래’로 이어지는 신뢰의 완성도에서 측정했음." data-lang-en="Success is measured by user trust: how many users complete onboarding, verify their profile, and return for repeat transactions."></p>
</div>
</div>
</div>
