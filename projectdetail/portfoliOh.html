<section id="discover" class="section-wrapper discover-section">
<div class="pin-wrapper">
<p class="discover-header" data-lang-ko="왜 대부분의 포트폴리오는 실패할까? (그리고 나는 어떻게 바꿨나)" data-lang-en="WHY MOST PORTFOLIOS FAIL (AND HOW I FIXED IT)"></p>
<div class="discover-content-left section-main-content hide-scrollbar" data-lang-ko="대부분의 포트폴리오는 껍데기만 예쁘고 깊이가 없거나(Figma, GitHub 링크만), 텍스트만 가득해 읽기 힘듭니다. 저는 “진짜 동작하는” 사이트, 즉 멀티페이지·모바일 반응형·다크모드·다국어 지원은 물론, 사용자가 진짜로 탐험할 수 있는 인터랙티브 경험을 만들고자 했습니다." data-lang-en="Most portfolios are either pretty shells with no depth (just Figma or GitHub links), or endless text dumps that are hard to engage with. I wanted to build a site that actually works: multi-page, mobile-responsive, supports dark mode, language switch, and offers a truly interactive experience—not just a static page.">
</div>
</div>
</section>
<section id="define" class="section-wrapper define-section">
<div class="pin-wrapper">
<div class="define-header" data-lang-ko="핵심 도전과제" data-lang-en="CORE CHALLENGE"></div>
<div class="define-container section-main-content hide-scrollbar">
<div class="define-box issue-box">
<h4 data-lang-ko="핵심 문제" data-lang-en="Core Issue"></h4>
<p data-lang-ko="대부분의 포트폴리오는 실제 문제 해결 과정을 보여주지 못합니다. 채용자는 결과만 보고, 내가 어떤 고민과 과정을 거쳤는지 알기 어렵죠. 저는 그 ‘과정’을 사용자에게 직접 보여주고, 체험하게 만들고 싶었습니다." data-lang-en="Most portfolios fail to communicate real problem-solving. Recruiters can't see your thinking, only the outcome. I wanted to make the process visible and let users actively interact with my work."></p>
</div>
<div class="define-main-text">
<p data-lang-ko="이를 해결하기 위해 하이라이터 기능을 설계. 사용자가 선택한 정보는 로컬 스토리지에 저장됨. 이후 Connect 페이지에서 하이라이트한 내용을 한 번에 모아보고, 이를 기반으로 맞춤 메시지 초안까지 쉽게 만들 수 있습니다." data-lang-en="I designed a highlighter feature: users can mark and save any “meaning chunk” throughout the site. These are stored locally and can be reviewed/managed on the Connect page, where users can generate personalized message drafts to contact me, based on what they found interesting."></p>
</div>
<div class="define-box success-box">
<h4 data-lang-ko="성공 지표" data-lang-en="Success Measure"></h4>
<p data-lang-ko="성공의 기준은 단순히 “멋지다!”가 아니라, 방문자가 내 문제해결력과 사고방식, 그리고 실제 일하는 방식을 명확하게 이해하고, 자신만의 방식으로 쉽게 소통할 수 있도록 하는 것입니다." data-lang-en="Success means visitors leave with not just a good impression, but a clear sense of my process and mindset—and with tools to easily reach out, tailored to what resonated with them."></p>
</div>
</div>
</div>
</section>

<p class="section-intro-text" data-lang-ko="이 사이트를 그냥 포트폴리오가 아닌, 진짜 웹앱 프로젝트처럼 접근했습니다. 헤더, 푸터, AI 기능 등은 모두 모듈화해서 5개 페이지에 공통 적용했고, 온보딩 플로우로 처음 방문하는 사용자도 핵심 기능을 쉽게 익힐 수 있게 했습니다. 각 페이지마다 다른 인터랙션을 설계해, 매번 새로운 경험을 제공합니다." data-lang-en="I treated the site as a real web app project, not just a portfolio. Every component is modularized: header, footer, and AI features are shared across all five pages. The onboarding flow helps first-time users explore core features. Every page has its own interactions—making each visit unique and memorable."></p>
</div>
<div class="content-slide image-text-right">
<div class="text-block">
<h4 data-lang-ko="와이어프레임에서 목업으로" data-lang-en="From Wireframe to Mockup"></h4>
<p data-lang-ko="기본 구조와 사용자 흐름을 파악하기 위해 저사양 와이어프레임으로 작업을 시작했습니다. 이후 시각적 디자인 요소와 인터랙티브 컴포넌트를 통합하며 고사양 목업으로 빠르게 발전시켰습니다." data-lang-en="The journey began with low-fidelity wireframes to map out the basic structure and user flow. This quickly evolved into high-fidelity mockups, incorporating visual design elements and preparing for the interactive components."></p>
</div>
<div class="image-wrapper">
<img src="./portfoliOh/portfoliowireframe.png" alt="Animated GIF showing a wireframe morphing into the final high-fidelity mockup">
<span class="image-caption" data-lang-ko="와이어프레임이 최종 목업으로 변화하는 과정을 보여주는 모핑 GIF." data-lang-en="A morphing GIF that shows the evolution from wireframe to the final mockup."></span>
</div>
</div>
<div class="content-slide image-text-left">
<div class="image-wrapper">
<img src="./portfoliOh/portfolioAnnotatedUI.gif" alt="GIF cycling through multiple pages to show consistent design language">
<span class="image-caption" data-lang-ko="여러 페이지를 빠르게 전환하며 헤더, 폰트, 푸터의 일관성을 증명하는 GIF." data-lang-en="A GIF that proves visual consistency by cycling through multiple pages, highlighting the shared header, fonts, and footer."></span>
</div>
<div class="text-block">
<h4 data-lang-ko="응집력 있는 시각적 언어 확립" data-lang-en="Establishing a Cohesive Visual Language"></h4>
<p data-lang-ko="일관된 시각적 스타일을 확립하는 것이 중요했습니다. 전체 포트폴리오에 걸쳐 통일되고 매력적인 미학을 유지하기 위해 타이포그래피(제목은 Monda, 본문은 Albert Sans), 색상 팔레트, 일반 UI 원칙을 정의하는 포괄적인 스타일 가이드를 개발했습니다." data-lang-en="A consistent visual style was critical. I developed a comprehensive style guide, defining the typography (Monda for headings, Albert Sans for body), color palette, and general UI principles to ensure a unified and appealing aesthetic across the entire portfolio."></p>
</div>
</div>
<div class="content-slide image-text-right">
<div class="text-block">
<h4 data-lang-ko="사용자 안내를 위한 인터랙티브 디자인" data-lang-en="Interactive Design for User Guidance"></h4>
<p data-lang-ko="클릭할 요소가 많은 사이트의 특성을 고려하여, 사용자가 다음 행동을 쉽게 인지할 수 있도록 커스텀 커서와 미세한 인터랙션을 설계했습니다. 이는 단순한 장식을 넘어, 사용자의 행동을 유도하는 기능적 역할을 합니다." data-lang-en="Considering the click-heavy nature of the site, I designed a custom cursor and micro-interactions to help users easily recognize their next action. This goes beyond mere decoration to serve a functional role in guiding user behavior."></p>
</div>
<div class="image-wrapper">
<img src="./portfoliOh/portfolioCustomCursor.gif" alt="Storytelling GIF showing the problem of a small cursor and the solution of a custom cursor with micro-interactions">
<span class="image-caption" data-lang-ko="일반 커서의 문제점과 이를 해결하는 커스텀 커서 및 마이크로 인터랙션을 대비시켜 보여주는 스토리텔링 GIF." data-lang-en="A storytelling GIF contrasting the problem of a standard cursor with the solution: a custom cursor and micro-interactions."></span>
</div>
</div>
