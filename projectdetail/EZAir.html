<div class="discover-content-left section-main-content hide-scrollbar" data-lang-ko="대부분의 예약 사이트가 AI를 내세우지만, 실제로는 사용자가 제대로 활용하지 못합니다. 리서치 결과, 많은 사용자가 스마트 기능의 존재조차 몰랐죠. 그래서 저는 ‘누구도 놓칠 수 없게’ AI 기능을 인트로 애니메이션과 검색/추천의 전면 배치로 적극 노출시켰습니다." data-lang-en="Most booking sites promote AI but users miss out. My research showed users didn’t even see smart features. So I decided to make AI tools impossible to ignore: animated intros, front-and-center search, and recommendations.">
</div>
</div>
</section>

<h4 data-lang-ko="핵심 문제" data-lang-en="Core Issue"></h4>
<p data-lang-ko="대부분의 플랫폼에 AI 기능이 있지만, UX 구조상 사용자에게 잘 보이지 않아 최적의 항공편을 놓치고 좌절하게 만듭니다." data-lang-en="Booking platforms have AI, but the user experience hides it. Users end up frustrated, missing out on the best flights."></p>
</div>
<div class="define-main-text">
<p data-lang-ko="그래서 자연어 검색과 AI 추천을 메인으로 내세워, 누구나 쉽게 인식·활용할 수 있게 설계했습니다. 진짜 성공은 ‘기능이 보이는 것’만이 아니라, 실제로 사용자들이 쉽게 이득을 보는 것이라고 생각했습니다." data-lang-en="I set out to make natural language search and AI recommendations the hero—always visible, always easy to use. Success means users not only notice, but actually benefit from smart features."></p>
</div>
<div class="define-box success-box">
<h4 data-lang-ko="성공 지표" data-lang-en="Success Measure"></h4>
<p data-lang-ko="성공 기준: 사용자들이 쉽게 최적의 항공편을 찾고, 스마트 기능에 호기심을 갖고 직접 시도해보는 경험을 만드는 것." data-lang-en="Success = effortless discovery of best flights, and users feeling curious (not overwhelmed) about smart features."></p>
</div>
